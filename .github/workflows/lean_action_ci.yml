name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lean:
    name: Lean proofs and axiom audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1

  python:
    name: SymPy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q tests
