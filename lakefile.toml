name = "lean4-portfolio"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Portfolio", "Solutions", "Test"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc1"

[[lean_lib]]
name = "Portfolio"

[[lean_lib]]
name = "Solutions"

[[lean_lib]]
name = "Test"
